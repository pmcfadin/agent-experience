# house_lib calibration (design §5, phase 2) for world L16-c0-w2: groups A (no hints) and P-hand
# (the world's handbook) on the dev-seed panel `calibration.calibration_tasks(family, per_lesson=8)`,
# 128 tasks, so 256 episodes. Feeds `calibration.filter_lessons`: a lesson A passes in more
# than 20% of its checks is guessable; one P-hand passes in under 60% is not learnable. Memory settings
# match the core grid's B: the memory block goes right after the ticket (design §10, 2026-11-01).
# Settings and panel rule as w1's exp21 / exp24, for the sealed study's new world seed (core-grid
# §10, 2026-11-07). Generated by `calibration.batch_texts`; tests/test_house_lib.py checks the items.
