# house_lib learnability control for world L16-c50-w1 (design §5, §10 decision 2026-11-02): group P-task, the
# handbook lines of each ticket's own lessons only, on exp21's panel (`calibration_tasks(family,
# per_lesson=8)`, 128 tasks, 128 episodes). With exp21's group A it feeds `calibration.filter_lessons`
# (told="P-task"); exp21's P-hand (the whole handbook) stays as the comparison that measures the
# handbook's length. Generated; tests/test_house_lib.py checks the items.
name: exp24-learn-L16-c50-w1
base_config: experiments/phase0-local.yaml
overrides:
  memory_service.record_format: lesson-v3
  memory_service.recall_types: [experience]
  memory_service.agent_search: true
  memory_service.experience_position: after_ticket
  rules: {enabled: true, store: verbatim}
