# Remainder of exp21-calib-L64-c0-w1, group A only (190 episodes). The host rebooted on
# 2026-11-08 05:24 UTC while that batch was running; 643 of its 1024 episodes were recorded
# (322 A, 321 P-hand) and `elh run-batch` cannot resume. The recorded rows are untouched; this file
# schedules exactly the panel tasks of A that have no row in the original batch (found by comparing
# `schedule()` with the stored (test_group, task_id)), with the original's base_config, overrides,
# family, histories and phase label. The registration differs from the original only in `name`
# (it is part of the run id and config hash); group A has no per-run memory, so episodes are
# comparable. analysis/exp17_calibration.py pools `exp21-calib-<world>` and `exp21-calib-<world>-rest*`.
