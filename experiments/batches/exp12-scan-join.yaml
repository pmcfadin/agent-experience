# exp11 settings on a second bug type, nested_scan_join (difficulty probe: A 2/3). Does B/C over A carry
# to another cause? Utility calibration is exp10/11's (quadratic_membership train recalls); recalibrating
# on this cause's own train recalls would need a pilot, so this is a stated deviation.
name: exp12-scan-join
base_config: experiments/phase0-local.yaml
overrides:
  memory_service.record_format: lesson-v3
  memory_service.recall_types: [experience]
  memory_service.agent_search: true
  rules: {enabled: true, store: verbatim}
  utility: {k1: 10, k2: 5, delta: 0.8378, sim_mean: 0.8535, sim_std: 0.01762, units_per_doc: 1,
            reward_mode: spec-signed}
  workflows: {induce_every: 5, repeats: 2, margin: 0.0, max_library_tokens: 1500}
  procedure_source: awm
family: cpu_mem
histories: 1
groups: [A, B, C]
phases:
  - train:
      tasks: {causes: [nested_scan_join], themes: [billing, logistics, telemetry, course_registration, network_flows], seeds: [1000, 1003]}
  - eval:
      label: after-15
      tasks: {causes: [nested_scan_join], themes: [inventory], seeds: [2000, 2012]}
dev:
  tasks: {causes: [nested_scan_join], themes: [billing, logistics, telemetry], seeds: [3000, 3002]}
