# exp1 with the ticket-first record format (ticket-v0) instead of lesson-v1. Same tasks and
# order as exp1 (the shuffle does not depend on the experiment name), so only the record differs.
name: exp4-record-format
base_config: experiments/phase0-local.yaml
overrides: {memory_service.record_format: ticket-v0}
family: cpu_mem
histories: 1
groups: [A, B]
phases:
  - train:
      tasks: {causes: [queue_pop_front], themes: [billing, logistics, telemetry, course_registration, network_flows], seeds: [1000, 1003]}
  - eval:
      label: after-15
      tasks: {causes: [queue_pop_front], themes: [inventory], seeds: [2000, 2010]}
