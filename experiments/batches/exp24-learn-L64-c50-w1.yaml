# house_lib learnability control for world L64-c50-w1 (design §5, §10 decision 2026-11-02): group P-task, the
# handbook lines of each ticket's own lessons only, on exp21's panel (`calibration_tasks(family,
# per_lesson=8)`, 512 tasks, 512 episodes). With exp21's group A it feeds `calibration.filter_lessons`
# (told="P-task"); exp21's P-hand (the whole handbook) stays as the comparison that measures the
# handbook's length. Generated; tests/test_house_lib.py checks the items.
