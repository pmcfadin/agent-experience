# Rerun of the 7 exp21-calib-L64-c50-w1 group P-hand episodes that ran while the model server was degenerate
# (every reply 8,192 '?', Nov 9 00:17-05:09). They are listed in experiments/calibration/excluded-episodes.json and left out
# of the calibration by analysis/exp17_calibration.py; the database rows are untouched. Same base_config, overrides,
# family, histories and phase label as the original; only `name` differs (it is part of the run id and config hash),
# and group P-hand has no per-run memory, so the episodes are comparable. exp17_calibration.py pools `exp21-calib-<world>-rest*`.
name: exp21-calib-L64-c50-w1-rest-phand
base_config: experiments/phase0-local.yaml
overrides:
  memory_service.record_format: lesson-v3
  memory_service.recall_types: [experience]
  memory_service.agent_search: true
  memory_service.experience_position: after_ticket
  rules: {enabled: true, store: verbatim}
family: house_lib/L64-c50-w1
histories: 1
groups: [P-hand]
phases:
- eval:
    label: calibration
    tasks:
      items:
      - [feature_flag.shipping, telemetry, 3186]
      - [region_redaction.eu, network_flows, 3336]
      - [region_redaction.latam, network_flows, 3344]
      - [region_redaction.nordics, inventory, 3364]
      - [required_wrapper.orders, network_flows, 3408]
      - [required_wrapper.orders, course_registration, 3415]
      - [required_wrapper.payroll, logistics, 3429]
