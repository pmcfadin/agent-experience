# house_lib learnability control for world L4-c0-w2 (design §5, §10 decision 2026-11-02): group P-task, the
# handbook lines of each ticket's own lessons only, on the calibration panel (`calibration_tasks(family,
# per_lesson=8)`, 32 tasks, 32 episodes). With the calibration's group A it feeds `calibration.filter_lessons`
# (told="P-task"); the calibration's P-hand (the whole handbook) stays as the comparison that measures the
# handbook's length. Settings and panel rule as w1's exp21 / exp24, for the sealed study's new world seed (core-grid
# §10, 2026-11-07). Generated by `calibration.batch_texts`; tests/test_house_lib.py checks the items.
name: exp41-learn-L4-c0-w2
base_config: experiments/phase0-local.yaml
overrides:
  memory_service.record_format: lesson-v3
  memory_service.recall_types: [experience]
  memory_service.agent_search: true
  memory_service.experience_position: after_ticket
  rules: {enabled: true, store: verbatim}
family: house_lib/L4-c0-w2
histories: 1
groups: [P-task]
phases:
- eval:
    label: calibration
    tasks:
      items:
      - [event_fields.shipping, telemetry, 3000]
      - [event_fields.shipping, network_flows, 3001]
      - [event_fields.shipping, billing, 3002]
      - [event_fields.shipping, course_registration, 3003]
      - [event_fields.shipping, logistics, 3004]
      - [event_fields.shipping, inventory, 3005]
      - [event_fields.shipping, telemetry, 3006]
      - [event_fields.shipping, network_flows, 3007]
      - [partner_format.elm, telemetry, 3008]
      - [partner_format.elm, network_flows, 3009]
      - [partner_format.elm, billing, 3010]
      - [partner_format.elm, course_registration, 3011]
      - [partner_format.elm, logistics, 3012]
      - [partner_format.elm, inventory, 3013]
      - [partner_format.elm, telemetry, 3014]
      - [partner_format.elm, network_flows, 3015]
      - [required_wrapper.reporting, telemetry, 3016]
      - [required_wrapper.reporting, network_flows, 3017]
      - [required_wrapper.reporting, billing, 3018]
      - [required_wrapper.reporting, course_registration, 3019]
      - [required_wrapper.reporting, logistics, 3020]
      - [required_wrapper.reporting, inventory, 3021]
      - [required_wrapper.reporting, telemetry, 3022]
      - [required_wrapper.reporting, network_flows, 3023]
      - [unit_convention.catalog, telemetry, 3024]
