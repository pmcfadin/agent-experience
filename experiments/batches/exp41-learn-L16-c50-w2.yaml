# house_lib learnability control for world L16-c50-w2 (design §5, §10 decision 2026-11-02): group P-task, the
# handbook lines of each ticket's own lessons only, on the calibration panel (`calibration_tasks(family,
# per_lesson=8)`, 128 tasks, 128 episodes). With the calibration's group A it feeds `calibration.filter_lessons`
# (told="P-task"); the calibration's P-hand (the whole handbook) stays as the comparison that measures the
# handbook's length. Settings and panel rule as w1's exp21 / exp24, for the sealed study's new world seed (core-grid
# §10, 2026-11-07). Generated by `calibration.batch_texts`; tests/test_house_lib.py checks the items.
