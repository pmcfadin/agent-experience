# Does memory help on the cause it trained on? B trains on 15 queue_pop_front tickets across five
# themes; then A and B both fix 10 new tickets of the same cause in the held-out theme (inventory).
name: exp1-memory-helps
base_config: experiments/phase0-local.yaml
family: cpu_mem
histories: 1
arms: [A, B]
phases:
  - train:
      tasks: {causes: [queue_pop_front], themes: [billing, logistics, telemetry, course_registration, network_flows], seeds: [1000, 1003]}
  - eval:
      label: after-15
      tasks: {causes: [queue_pop_front], themes: [inventory], seeds: [2000, 2010]}
